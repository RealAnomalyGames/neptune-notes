<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Neptune Notes — a simple web-based note-taking system."
    />

    <title>Neptune Notes</title>
  </head>

  <body>
    <div id="app">
      <header id="app-header">
        <h1>Neptune Notes</h1>

        <button id="new-note-button" type="button">
          + New Note
        </button>
      </header>

      <main id="app-main">
        <aside id="sidebar">
          <div id="search-container">
            <input
              id="search-input"
              type="search"
              placeholder="Search notes..."
              aria-label="Search notes"
            />
          </div>

          <nav id="note-list" aria-label="Notes">
            <!-- Notes will be added here later. -->
          </nav>
        </aside>

        <section id="editor" aria-label="Note editor">
          <input
            id="note-title"
            type="text"
            placeholder="Note title"
            aria-label="Note title"
          />

          <textarea
            id="note-content"
            placeholder="Start writing..."
            aria-label="Note content"
          ></textarea>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
