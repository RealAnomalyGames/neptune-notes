<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Neptune Notes — a simple web-based note-taking system."
    />

    <title>Neptune Notes</title>
  </head>

  <body>
    <div id="app">
      <header class="app-header">
        <div class="app-brand">
          <h1>Neptune Notes</h1>
        </div>

        <button id="new-note-button" type="button">
          + New Note
        </button>
      </header>

      <main class="notes-layout">
        <aside class="sidebar">
          <div class="sidebar-header">
            <input
              id="search-input"
              type="search"
              placeholder="Search notes..."
              aria-label="Search notes"
            />
          </div>

          <div id="note-list" class="note-list"></div>
        </aside>

        <section class="editor">
          <div class="editor-header">
            <input
              id="note-title"
              type="text"
              placeholder="Untitled Note"
              aria-label="Note title"
            />

            <span id="save-status" class="save-status">
              Saved
           </span>
          </div>

          <textarea
            id="note-content"
            placeholder="Start writing..."
            aria-label="Note content"
          ></textarea>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
